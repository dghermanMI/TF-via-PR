---
name: Test Parity

on:
  workflow_dispatch:
  pull_request:
    paths: [action.yml, tests/parity/**, .github/workflows/test_parity.yml]
    types: [opened, reopened, synchronize]

jobs:
  parity:
    runs-on: ubuntu-24.04

    permissions:
      actions: read # Required to identify workflow run.
      checks: write # Required to add status summary.
      contents: read # Required to checkout repository.

    strategy:
      fail-fast: false
      matrix:
        tool:
          - tofu
          - terraform
        # Format: <old plan value>-<new plan value>-<expected outcome>.
        test:
          - v1-v2-failure
          - v2-v2-success

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tofu
        if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: latest
          tofu_wrapper: false

      - name: Setup Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Parse test
        id: test
        env:
          TEST: ${{ matrix.test }}
        run: |
          IFS=- read -r old new expect <<< "$TEST"
          printf '%s\n' "old=$old" "new=$new" "expect=$expect" >> "$GITHUB_OUTPUT"

      - name: Plan old
        env:
          OLD: ${{ steps.test.outputs.old }}
          TOOL: ${{ matrix.tool }}
        run: |
          "$TOOL" -chdir=tests/parity init -input=false
          "$TOOL" -chdir=tests/parity plan -input=false -var "content=$OLD" -out=old.tfplan

      - name: Apply with parity
        id: tf
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/parity
          tool: ${{ matrix.tool }}
          command: apply
          arg-lock: false
          arg-var: content=${{ steps.test.outputs.new }}
          plan-file: tests/parity/old.tfplan
          plan-parity: true
          comment-pr: never
          tag-actor: never

      - name: Assert outcome
        env:
          EXPECT: ${{ steps.test.outputs.expect }}
          OUTCOME: ${{ steps.tf.outcome }}
        run: |
          if [[ "$OUTCOME" != "$EXPECT" ]]; then echo "::error::Expected $EXPECT, got $OUTCOME."; exit 1; fi
